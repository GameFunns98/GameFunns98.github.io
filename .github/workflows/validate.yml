name: Portfolio checks
on:
  push:
    branches: [feature/personal-portfolio, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/create-preview.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && hashFiles('dist/**') != '' }}
        with:
          name: portfolio-preview
          path: dist/
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && hashFiles('test-results/review/**') != '' }}
        with:
          name: review-screenshots
          path: test-results/review/
          retention-days: 3
