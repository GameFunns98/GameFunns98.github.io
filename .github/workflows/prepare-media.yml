name: Prepare portfolio media
on:
  push:
    branches: [feature/personal-portfolio]
    paths: ['scripts/prepare-media.mjs']
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/prepare-media.mjs
      - name: Cache verified media on the feature branch
        run: |
          git add public/fonts public/data/medal.json public/images/medal-*.jpg
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Cache licensed fonts and verified Medal thumbnail"
            git push origin HEAD:feature/personal-portfolio
          fi
