name: Resolve initial dependency lock
on:
  push:
    branches: [feature/personal-portfolio]
    paths: ['package.json']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Record lock on the feature branch
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Lock frontend and test dependencies"
            git push origin HEAD:feature/personal-portfolio
          fi
