name: Export verified local preview
on:
  push:
    branches: [feature/personal-portfolio]
    paths: ['.github/workflows/export-preview.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build
      - run: node scripts/create-preview.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/offline.spec.ts
      - name: Export review images
        run: |
          node --input-type=module -e "
          import sharp from 'sharp';
          import fs from 'node:fs/promises';
          for(const name of ['offline-desktop-dark','offline-desktop-light','offline-mobile-light']){
            const file = 'test-results/review/'+name+'.png';
            const meta=await sharp(file).metadata();
            const bytes=await sharp(file).extract({left:0,top:0,width:meta.width,height:Math.min(meta.height,900)}).resize({width:Math.min(meta.width,1100)}).jpeg({quality:80}).toBuffer();
            console.log('REVIEW_IMAGE',name,bytes.toString('base64'));
          }"
