name: Export verified local preview
on:
  push:
    branches: [feature/personal-portfolio]
    paths: ['.github/workflows/export-preview.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npm run build
      - name: Transfer preview through the connected GitHub channel
        run: |
          tar --exclude='./images/forest.webp' --exclude='./images/sakura.webp' --exclude='./images/portrait.webp' -czf /tmp/portfolio-preview.tgz -C dist .
          node -e "const b = require('fs').readFileSync('/tmp/portfolio-preview.tgz').toString('base64'); for(let i=0;i<b.length;i+=12000) console.log('PREVIEW_PART', i, b.slice(i,i+12000));"
