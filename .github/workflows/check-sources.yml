name: Check public portfolio integrations
on:
  push:
    branches: [feature/personal-portfolio]
    paths: ['.github/workflows/check-sources.yml']
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read public provider metadata
        shell: node {0}
        run: |
          (async () => {
            const endpoints = {
              medal: 'https://medal.tv/games/gta-v/clips/klxbis7ZHUJDfDyKB',
              embed: 'https://medal.tv/clip/klxbis7ZHUJDfDyKB/vp',
              lanyard: 'https://api.lanyard.rest/v1/users/922153911161323601'
            };
            for (const [service,url] of Object.entries(endpoints)) {
              try {
                const res = await fetch(url, { signal: AbortSignal.timeout(12000) });
                const body = await res.text();
                console.log(service, res.status, res.url, res.headers.get('content-type'));
                if (service === 'lanyard') {
                  const d = JSON.parse(body);
                  console.log({success:d.success, error:d.error?.code, correctId:d.data?.discord_user?.id === '922153911161323601'});
                } else {
                  const tags = body.match(/<(?:meta|link)\s[^>]+>/gi) || [];
                  for (const tag of tags.filter(t => /og:(title|image|video)|twitter:player|oembed/i.test(t)).slice(0,12)) console.log(tag.slice(0,650));
                }
              } catch { console.log(service, 'unavailable'); }
            }
          })();
