name: Check public portfolio integrations
on:
  push:
    branches: [feature/personal-portfolio]
    paths: ['.github/workflows/check-sources.yml']
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read official Medal embed metadata
        shell: node {0}
        run: |
          (async () => {
            const url = 'https://medal.tv/api/oembed?url=' + encodeURIComponent('https://medal.tv/games/gta-v/clip/klxbis7ZHUJDfDyKB');
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
            console.log('OEMBED', response.status, await response.text());
          })();
