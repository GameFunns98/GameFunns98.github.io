name: Refresh public profile data
on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
  push:
    branches: [feature/personal-portfolio, main]
    paths:
      - 'scripts/sync-medal.mjs'
      - 'scripts/sync-instagram.mjs'
      - '.github/workflows/sync-data.yml'
permissions:
  contents: write
concurrency:
  group: profile-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Refresh Steam snapshot
        continue-on-error: true
        run: npm run sync:steam
      - name: Refresh owned Medal clips
        continue-on-error: true
        run: npm run sync:medal
      - name: Refresh Instagram posts
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: npm run sync:instagram
      - name: Save the public snapshots
        env:
          SYNC_BRANCH: ${{ github.ref_name }}
        run: |
          git add src/data/medal.json src/data/instagram.json public/data/steam.json public/images/
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Refresh public profile snapshots"
            git push origin "HEAD:$SYNC_BRANCH"
          fi
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: refreshed-profile-preview
          path: dist/
          retention-days: 7
